# BETA-App „IPTV Beta“ mit VLCKit 4 (Bild-in-Bild auch für MKV)
# Läuft als eigene App neben der normalen Version.
name: IPTVPlayerBeta
options:
  bundleIdPrefix: com.privat
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.4"
    CURRENT_PROJECT_VERSION: "1"

targets:
  IPTVPlayerBeta:
    type: application
    platform: iOS
    sources:
      - path: IPTVPlayer
        excludes:
          - VLCPlayerView.swift
          - Info.plist
      - path: IPTVPlayerVLC4
    info:
      path: IPTVPlayerVLC4/Info.plist
      properties:
        CFBundleDisplayName: IPTV Beta
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.privat.iptvplayer.beta
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""

schemes:
  IPTVPlayerBeta:
    build:
      targets:
        IPTVPlayerBeta: all
