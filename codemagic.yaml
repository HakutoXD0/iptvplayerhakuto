workflows:
  ios-unsigned:
    name: IPTV Player (unsignierte IPA)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Projekt mit XcodeGen erzeugen
        script: |
          brew install xcodegen
          xcodegen generate
      - name: App bauen (unsigniert)
        script: |
          xcodebuild \
            -project IPTVPlayer.xcodeproj \
            -scheme IPTVPlayer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: IPA packen
        script: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/IPTVPlayer.app Payload/
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Payload/IPTVPlayer.app/Info.plist)
          zip -qry "IPTVPlayer-v${VERSION}.ipa" Payload
    artifacts:
      - IPTVPlayer-v*.ipa

  ios-beta:
    name: IPTV Beta (VLCKit 4, Bild-in-Bild)
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Projekt erzeugen und VLCKit 4 laden
        script: |
          brew install xcodegen
          xcodegen generate --spec project-beta.yml
          pod install --repo-update
      - name: VLCKit-4-Schnittstellen ins Log schreiben
        script: |
          #!/usr/bin/env bash
          D=$(find Pods/VLCKit -type d -path "*ios-arm64*" -name Headers | grep -v simulator | head -1)
          [ -z "$D" ] && D=$(find Pods/VLCKit -type d -path "*ios-arm64*" -name Headers | head -1)
          echo "== Header-Ordner: $D"
          for F in $(grep -rl "PictureInPicture" "$D" 2>/dev/null); do
            echo "===== $F"
            grep -n -E "PictureInPicture|^- \(|^@protocol|^@interface|^@end" "$F" | grep -v "^[0-9]*: *\*" | head -60
          done
      - name: App bauen (unsigniert)
        script: |
          #!/usr/bin/env bash
          set -o pipefail
          xcodebuild \
            -workspace IPTVPlayerBeta.xcworkspace \
            -scheme IPTVPlayerBeta \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | grep -E "error:|BUILD (SUCCEEDED|FAILED)|\*\* "
      - name: IPA packen
        script: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/IPTVPlayerBeta.app Payload/
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Payload/IPTVPlayerBeta.app/Info.plist)
          zip -qry "IPTVPlayer-v${VERSION}-beta.ipa" Payload
    artifacts:
      - IPTVPlayer-v*-beta.ipa
