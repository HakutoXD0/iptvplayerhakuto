workflows:
  ios-unsigned:
    name: IPTV Player (unsignierte IPA)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Projekt mit XcodeGen erzeugen
        script: |
          brew install xcodegen
          xcodegen generate
      - name: App bauen (unsigniert)
        script: |
          xcodebuild \
            -project IPTVPlayer.xcodeproj \
            -scheme IPTVPlayer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: IPA packen
        script: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/IPTVPlayer.app Payload/
          zip -qry IPTVPlayer.ipa Payload
    artifacts:
      - IPTVPlayer.ipa
