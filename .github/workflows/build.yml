name: iOS-App bauen (IPA)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Neueste Xcode-Version wählen
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Verwende $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: XcodeGen installieren & Projekt erzeugen
        run: |
          brew install xcodegen
          xcodegen generate

      - name: App bauen (unsigniert)
        run: |
          xcodebuild \
            -project IPTVPlayer.xcodeproj \
            -scheme IPTVPlayer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: IPA packen
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/IPTVPlayer.app Payload/
          zip -qry IPTVPlayer.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: IPTVPlayer-ipa
          path: IPTVPlayer.ipa
