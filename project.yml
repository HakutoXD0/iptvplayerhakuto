# XcodeGen: erzeugt das Xcode-Projekt automatisch (im GitHub-Build)
name: IPTVPlayer
options:
  bundleIdPrefix: com.privat
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.4.2"
    CURRENT_PROJECT_VERSION: "1"

packages:
  VLCKitSPM:
    url: https://github.com/koombea/vlckit-spm
    from: 3.6.0

targets:
  IPTVPlayer:
    type: application
    platform: iOS
    sources:
      - path: IPTVPlayer
    dependencies:
      - package: VLCKitSPM
        product: VLCKitSPM
    info:
      path: IPTVPlayer/Info.plist
      properties:
        CFBundleDisplayName: IPTV
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.privat.iptvplayer
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""

schemes:
  IPTVPlayer:
    build:
      targets:
        IPTVPlayer: all
